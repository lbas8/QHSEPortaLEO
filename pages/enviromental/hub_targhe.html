    let records = caricaDati();

    function caricaDati() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (_) {}
      return JSON.parse(JSON.stringify(DEFAULT_DATA));
    }

    function salvaDati() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      try {
        const unifiedRaw = localStorage.getItem(UNIFIED_STORAGE_KEY);
        const unified = unifiedRaw ? JSON.parse(unifiedRaw) : {};
        unified[DB_KEY] = records;
        localStorage.setItem(UNIFIED_STORAGE_KEY, JSON.stringify(unified));
      } catch (_) {}
      if (typeof firebase !== "undefined" && firebase.apps && firebase.apps.length) {
        firebase.database().ref("mds_database/" + DB_KEY).set(records).catch(() => {});
      }
      aggiornaConteggio();
    }

    function aggiornaConteggio() {
      const tot = MODE === "plates_map"
        ? records.reduce((acc, r) => acc + (r.targhe ? r.targhe.length : 0), 0)
        : records.length;
      const extra = MODE === "plates_map" ? ` (${records.length} aziende)` : "";
      document.getElementById("conteggio-record").textContent = `${tot} voci attive${extra}`;
    }

    function renderTabella() {
      const q = (document.getElementById("filtro-ricerca").value || "").toLowerCase().trim();
      const wrap = document.getElementById("tabella-wrap");

      if (MODE === "string_list") {
        const filtered = records
          .map((val, idx) => ({ val, idx }))
          .filter(item => !q || item.val.toLowerCase().includes(q));

        wrap.innerHTML = `
          <table class="w-full text-left text-xs border-collapse">
            <thead class="bg-slate-950 text-slate-300">
              <tr>
                <th class="p-3">${COLUMNS[0].label}</th>
                <th class="p-3 w-20 text-center">Elimina</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-800">
              ${filtered.map(item => `
                <tr>
                  <td class="p-2">
                    <input type="text" value="${item.val.replace(/"/g, '&quot;')}"
                      onchange="records[${item.idx}] = this.value; salvaDati();"
                      class="w-full bg-slate-900 border border-slate-800 rounded px-2.5 py-1.5 text-white">
                  </td>
                  <td class="p-2 text-center">
                    <button type="button" onclick="records.splice(${item.idx}, 1); salvaDati(); renderTabella();" class="text-rose-400 hover:text-rose-300 cursor-pointer">
                      <i class="fa-solid fa-trash"></i>
                    </button>
                  </td>
                </tr>
              `).join("")}
            </tbody>
          </table>`;
        aggiornaConteggio();
        return;
      }

      if (MODE === "plates_map") {
        const filtered = records
          .map((row, idx) => ({ row, idx }))
          .filter(item => {
            if (!q) return true;
            const hay = `${item.row.azienda} ${(item.row.targhe || []).join(" ")}`.toLowerCase();
            return hay.includes(q);
          });

        wrap.innerHTML = `
          <table class="w-full text-left text-xs border-collapse">
            <thead class="bg-slate-950 text-slate-300">
              <tr>
                <th class="p-3 w-1/3">Trasportatore / Azienda</th>
                <th class="p-3">Targhe Autorizzate (separate da ;)</th>
                <th class="p-3 w-20 text-center">Elimina</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-800">
              ${filtered.map(item => {
                const tStr = (item.row.targhe || []).join("; ");
                return `
                  <tr>
                    <td class="p-2">
                      <input type="text" value="${(item.row.azienda || "").replace(/"/g, '&quot;')}"
                        onchange="records[${item.idx}].azienda = this.value; salvaDati();"
                        class="w-full bg-slate-900 border border-slate-800 rounded px-2.5 py-1.5 text-emerald-300 font-semibold">
                    </td>
                    <td class="p-2">
                      <input type="text" value="${tStr.replace(/"/g, '&quot;')}"
                        onchange="records[${item.idx}].targhe = this.value.split(/[;,]+/).map(s => s.trim()).filter(Boolean); salvaDati();"
                        class="w-full bg-slate-900 border border-slate-800 rounded px-2.5 py-1.5 text-white">
                    </td>
                    <td class="p-2 text-center">
                      <button type="button" onclick="records.splice(${item.idx}, 1); salvaDati(); renderTabella();" class="text-rose-400 hover:text-rose-300 cursor-pointer">
                        <i class="fa-solid fa-trash"></i>
                      </button>
                    </td>
                  </tr>
                `;
              }).join("")}
            </tbody>
          </table>`;
        aggiornaConteggio();
        return;
      }

      const filtered = records
        .map((row, idx) => ({ row, idx }))
        .filter(item => {
          if (!q) return true;
          return COLUMNS.some(c => String(item.row[c.key] ?? "").toLowerCase().includes(q));
        });

      wrap.innerHTML = `
        <table class="w-full text-left text-xs border-collapse">
          <thead class="bg-slate-950 text-slate-300">
            <tr>
              ${COLUMNS.map(c => `<th class="p-3">${c.label}</th>`).join("")}
              <th class="p-3 w-20 text-center">Elimina</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-800">
            ${filtered.map(item => `
              <tr>
                ${COLUMNS.map(c => `
                  <td class="p-2">
                    <input type="text" value="${String(item.row[c.key] ?? "").replace(/"/g, '&quot;')}"
                      onchange="records[${item.idx}]['${c.key}'] = this.value; salvaDati();"
                      class="w-full bg-slate-900 border border-slate-800 rounded px-2.5 py-1.5 text-white">
                  </td>
                `).join("")}

                  <button type="button" onclick="records.splice(${item.idx}, 1); salvaDati(); renderTabella();" class="text-rose-400 hover:text-rose-300 cursor-pointer">
                    <i class="fa-solid fa-trash"></i>
                  </button>
                </td>
              </tr>
            `).join("")}
          </tbody>
        </table>`;
      aggiornaConteggio();
    }

    function aggiungiRecord() {
      if (MODE === "string_list") {
        records.unshift("Nuova litologia");
      } else if (MODE === "plates_map") {
        records.unshift({ azienda: "Nuovo trasportatore", targhe: [] });
      } else {
        const empty = {};
        COLUMNS.forEach(c => empty[c.key] = "");
        records.unshift(empty);
      }
      salvaDati();
      renderTabella();
    }

    function esportaJson() {
      const blob = new Blob([JSON.stringify(records, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = DB_KEY + ".json";
      a.click();
      URL.revokeObjectURL(url);
    }

    function ripristinaDefault() {
      if (!confirm("Ripristinare i dati predefiniti del foglio Excel per questa sezione?")) return;
      records = JSON.parse(JSON.stringify(DEFAULT_DATA));
      salvaDati();
      renderTabella();
    }

    document.addEventListener("DOMContentLoaded", renderTabella);
  </script>
</body>
</html>
