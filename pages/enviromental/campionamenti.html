<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portale Campionamenti Ambientali</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #0b0f17; color: #f8fafc; }
    .glass-card { background: rgba(18, 24, 38, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-white">

  <!-- HEADER UNIFICATO -->
  <header class="w-full bg-slate-900/95 border-b border-slate-800 backdrop-blur-md sticky top-0 z-50 px-4 sm:px-8 py-3 shadow-lg">
    <div class="max-w-7xl mx-auto flex flex-col lg:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-4 w-full lg:w-auto justify-between lg:justify-start">
        <div class="flex items-center gap-3">
          <button onclick="history.back()" class="flex items-center gap-2 px-3 py-2 bg-slate-800/90 hover:bg-slate-700 border border-slate-700 text-slate-300 hover:text-white rounded-xl text-xs font-bold transition shadow-sm cursor-pointer">
            <i class="fa-solid fa-arrow-left text-amber-400"></i>
            <span class="hidden sm:inline">Indietro</span>
          </button>
          <div class="relative w-11 h-11 rounded-xl bg-amber-500/10 border-2 border-amber-400/80 flex items-center justify-center text-amber-400 shadow-md">
            <i class="fa-solid fa-vials text-xl"></i>
          </div>
          <div>
            <h1 class="font-black text-base sm:text-lg text-white tracking-wide uppercase leading-none">Campionamenti Ambientali</h1>
            <p class="text-[11px] text-amber-400 font-semibold mt-1">Quarto Valico dei Giovi — VICOC</p>
          </div>
        </div>
      </div>
      <div class="flex flex-wrap items-center justify-center lg:justify-end gap-3 w-full lg:w-auto">
        <button onclick="createNewFolder()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white px-3.5 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1.5 transition">
          <i class="fa-solid fa-folder-plus text-amber-400"></i> Nuova Cartella
        </button>
        <a href="campionamentoform.html" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3.5 py-1.5 rounded-xl text-xs font-bold flex items-center gap-2 shadow transition">
          <i class="fa-solid fa-plus"></i> Nuovo Campionamento
        </a>
        <a href="../../HomeQHSE.html" class="inline-flex items-center gap-2 px-3.5 py-1.5 bg-slate-800/90 border border-slate-700 hover:border-amber-400 rounded-full text-xs font-bold text-white transition shadow-sm">
          <svg viewBox="0 0 400 400" class="w-6 h-6 rounded-full flex-shrink-0">
            <path d="M 200 200 L 200 20 A 180 180 0 0 1 355.88 290 Z" fill="#0284c7" />
            <path d="M 200 200 L 355.88 290 A 180 180 0 0 1 44.12 290 Z" fill="#d97706" />
            <path d="M 200 200 L 44.12 290 A 180 180 0 0 1 200 20 Z" fill="#059669" />
            <circle cx="200" cy="200" r="65" fill="#0f172a" stroke="#ffffff" stroke-width="8"/>
            <text x="200" y="215" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle">QHSE</text>
          </svg>
          <span class="hidden sm:inline">Home</span>
        </a>
      </div>
    </div>
  </header>

    <div class="bg-white rounded-xl shadow-md p-5 border border-slate-200 mt-6">
      <div class="flex justify-between items-center mb-5 pb-3 border-b border-slate-200">
        <h2 class="text-md font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-vials text-emerald-600"></i> Archivio Campionamenti e Matrici
        </h2>
        <button onclick="createNewFolder()" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-2 rounded-lg text-xs font-medium flex items-center gap-1.5 transition">
          <i class="fa-solid fa-folder-plus text-amber-400"></i> Nuova Cartella Matrice
        </button>
      </div>

      <!-- SEZIONE 1: CAMPIONAMENTI NON CLASSIFICATI -->
      <div class="mb-8 bg-amber-50/50 border border-amber-200 rounded-xl p-4">
        <h3 class="text-sm font-bold text-amber-900 mb-3 flex items-center gap-2">
          <i class="fa-solid fa-mobile-screen-button text-amber-600"></i> Da Classificare (Salvati da Cantiere)
        </h3>
        <div id="unclassified-list" class="space-y-2">
          <p class="text-xs text-slate-400 italic">Connessione al Cloud in corso...</p>
        </div>
      </div>

      <!-- SEZIONE 2: CARTELLE PERSONALIZZATE -->
      <div>
        <h3 class="text-sm font-bold text-slate-700 mb-3 flex items-center gap-2">
          <i class="fa-solid fa-folder-tree text-sky-600"></i> Cartelle per Matrice / Cantiere
        </h3>
        <div id="folders-container" class="space-y-4">
          <p class="text-xs text-slate-400 italic">Connessione al Cloud in corso...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://vstvg-1f2f6-default-rtdb.europe-west1.firebasedatabase.app"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    let allFolders = {};
    let allCampionamenti = {};
    let dataLoaded = false;

    setTimeout(() => {
      if (!dataLoaded) {
        renderPortal();
      }
    }, 2500);

    db.ref('campionamenti').on('value', (snapshot) => {
      allCampionamenti = snapshot.val() || {};
      dataLoaded = true;
      renderPortal();
    }, (error) => {
      dataLoaded = true;
      renderPortal();
    });

    db.ref('campionamenti_cartelle').on('value', (snapshot) => {
      allFolders = snapshot.val() || {};
      dataLoaded = true;
      renderPortal();
    }, (error) => {
      dataLoaded = true;
      renderPortal();
    });

    function createNewFolder() {
      const folderName = prompt("Inserisci il nome della cartella o matrice (es. Matrice Acque, Terre e Rocce, Rifiuti):");
      if (!folderName) return;
      const folderId = folderName.trim().replace(/[.#$/[\]]/g, "_");
      
      db.ref('campionamenti_cartelle/' + folderId).set({
        nome: folderName.trim(),
        createdAt: Date.now()
      }, (err) => {
        if (err) alert("Errore: " + err.message);
        else alert("📁 Cartella creata con successo!");
      });
    }

    function moveCampionamento(campKey, targetFolderId) {
      if (targetFolderId === "ROOT") {
        db.ref('campionamenti/' + campKey + '/folderId').remove();
      } else {
        db.ref('campionamenti/' + campKey + '/folderId').set(targetFolderId);
      }
    }

    function deleteFolder(folderId, folderName) {
      if (confirm(`Eliminare la cartella "${folderName}"? I campionamenti torneranno in "Da Classificare".`)) {
        Object.keys(allCampionamenti).forEach(cKey => {
          if (allCampionamenti[cKey].folderId === folderId) {
            db.ref('campionamenti/' + cKey + '/folderId').remove();
          }
        });
        db.ref('campionamenti_cartelle/' + folderId).remove();
      }
    }

    function deleteCampionamento(cKey) {
      if (confirm(`Eliminare definitivamente il campionamento "${cKey}"?`)) {
        db.ref('campionamenti/' + cKey).remove();
      }
    }

    function renderPortal() {
      const unclassifiedContainer = document.getElementById('unclassified-list');
      const foldersContainer = document.getElementById('folders-container');
      
      unclassifiedContainer.innerHTML = '';
      foldersContainer.innerHTML = '';

      const folderKeys = Object.keys(allFolders);
      const campKeys = Object.keys(allCampionamenti);

      const unclassified = campKeys.filter(k => !allCampionamenti[k].folderId);

      if (unclassified.length === 0) {
        unclassifiedContainer.innerHTML = '<p class="text-xs text-slate-400 italic">Nessun campionamento in attesa di classificazione.</p>';
      } else {
        unclassified.forEach(cKey => {
          unclassifiedContainer.appendChild(createCampionamentoCard(cKey, allCampionamenti[cKey], folderKeys));
        });
      }

      if (folderKeys.length === 0) {
        foldersContainer.innerHTML = '<p class="text-xs text-slate-400 italic">Nessuna cartella creata. Clicca su "+ Nuova Cartella Matrice" per suddividere per matrice.</p>';
      } else {
        folderKeys.forEach(fKey => {
          const folder = allFolders[fKey];
          const folderCamps = campKeys.filter(cKey => allCampionamenti[cKey].folderId === fKey);

          const folderEl = document.createElement('div');
          folderEl.className = "border border-slate-200 rounded-xl overflow-hidden bg-slate-50/50 shadow-sm";

          folderEl.innerHTML = `
            <div class="bg-slate-200/70 px-4 py-3 flex justify-between items-center cursor-pointer border-b border-slate-200" onclick="toggleFolderContent('${fKey}')">
              <div class="flex items-center gap-2">
                <i class="fa-solid fa-folder text-amber-500 text-lg"></i>
                <span class="font-bold text-sm text-slate-800">${folder.nome || 'Cartella'}</span>
                <span class="text-xs bg-slate-300 text-slate-700 px-2 py-0.5 rounded-full font-semibold">${folderCamps.length} elementi</span>
              </div>
              <div class="flex items-center gap-2">
                <button onclick="event.stopPropagation(); deleteFolder('${fKey}', '${folder.nome}')" class="text-slate-400 hover:text-red-600 text-xs px-2 py-1" title="Elimina Cartella">
                  <i class="fa-solid fa-trash"></i>
                </button>
                <i id="icon_folder_${fKey}" class="fa-solid fa-chevron-down text-xs text-slate-500 transition-transform"></i>
              </div>
            </div>
            <div id="content_folder_${fKey}" class="p-3 space-y-2 bg-white hidden"></div>
          `;

          foldersContainer.appendChild(folderEl);

          const contentBox = folderEl.querySelector(`#content_folder_${fKey}`);
          if (folderCamps.length === 0) {
            contentBox.innerHTML = '<p class="text-xs text-slate-400 italic p-3">Cartella vuota.</p>';
          } else {
            folderCamps.forEach(cKey => {
              contentBox.appendChild(createCampionamentoCard(cKey, allCampionamenti[cKey], folderKeys));
            });
          }
        });
      }
    }

    function createCampionamentoCard(cKey, camp, folderKeys) {
      const dateStr = camp.datetime ? new Date(camp.datetime).toLocaleString() : 'Data N.D.';
      
      let folderOptions = `<option value="">-- Sposta in cartella --</option>`;
      if (camp.folderId) {
        folderOptions += `<option value="ROOT">📂 Riporta a "Da Classificare"</option>`;
      }
      folderKeys.forEach(fKey => {
        if (fKey !== camp.folderId) {
          folderOptions += `<option value="${fKey}">📁 ${allFolders[fKey].nome}</option>`;
        }
      });

      const div = document.createElement('div');
      div.className = "flex flex-wrap md:flex-nowrap justify-between items-center p-3 bg-white border border-slate-200 rounded-lg hover:border-slate-300 shadow-sm gap-3 transition";
      div.innerHTML = `
        <div class="flex-1 min-w-[200px]">
          <div class="font-bold text-sm text-slate-800 flex items-center gap-1.5">
            <i class="fa-solid fa-vial-circle-check text-sky-600"></i> ${cKey} <span class="text-xs bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded font-bold">${camp.matrice || 'Matrice'}</span>
          </div>
          <div class="text-xs text-slate-500 mt-0.5">
            Cantiere / Località: <strong class="text-slate-700">${camp.cantiere || 'N.D.'}</strong> | Laboratorio: <strong class="text-slate-700">${camp.laboratorio || 'N.D.'}</strong> | <i class="fa-regular fa-clock"></i> ${dateStr}
          </div>
        </div>

        <div class="flex items-center gap-2 w-full md:w-auto justify-end">
          <select onchange="if(this.value) moveCampionamento('${cKey}', this.value)" class="text-xs bg-slate-50 border border-slate-300 rounded p-1.5 outline-none focus:ring-1 focus:ring-sky-500">
            ${folderOptions}
          </select>
          
          <a href="campionamentoform.html?load=${encodeURIComponent(cKey)}" class="bg-sky-600 hover:bg-sky-500 text-white px-3 py-1.5 rounded text-xs font-medium flex items-center gap-1 shadow-sm transition whitespace-nowrap">
            <i class="fa-solid fa-eye"></i> Apri
          </a>

          <button onclick="deleteCampionamento('${cKey}')" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-2.5 py-1.5 rounded text-xs font-medium flex items-center gap-1 transition" title="Elimina">
            <i class="fa-solid fa-trash"></i>
          </button>
        </div>
      `;
      return div;
    }

    function toggleFolderContent(fKey) {
      const box = document.getElementById(`content_folder_${fKey}`);
      const icon = document.getElementById(`icon_folder_${fKey}`);
      if (box.classList.contains('hidden')) {
        box.classList.remove('hidden');
        icon.classList.add('rotate-180');
      } else {
        box.classList.add('hidden');
        icon.classList.remove('rotate-180');
      }
    }
  </script>
</body>
</html>
