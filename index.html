<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accesso Portale QHSE — Quarto Valico AV/AC</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Icona e Manifest personalizzati -->
  <link rel="apple-touch-icon" sizes="180x180" href="assets/img/QHSElogo.jpg">
  <link rel="icon" type="image/jpeg" sizes="192x192" href="assets/img/QHSElogo.jpg">
  <link rel="icon" type="image/jpeg" sizes="512x512" href="assets/img/QHSElogo.jpg">
  <meta name="apple-mobile-web-app-title" content="QHSE Cantiere">
  <meta name="application-name" content="QHSE Cantiere">
  <link rel="manifest" href="manifest.json">

  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-800 font-sans min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-2xl shadow-2xl border border-slate-700 max-w-md w-full p-8 space-y-6 text-center">
    
    <!-- LOGO E INTESTAZIONE -->
    <div class="space-y-3">
      <div class="w-20 h-20 mx-auto rounded-full overflow-hidden border-2 border-slate-700 shadow-md flex items-center justify-center bg-slate-900">
        <img src="assets/img/QHSElogo.jpg" alt="Logo QHSE" class="w-full h-full object-cover">
      </div>
      <h1 class="text-xl font-black text-slate-900 uppercase tracking-wide">Portale QHSE Cantiere</h1>
      <p class="text-xs text-slate-500 font-medium">Verifica autenticazione in corso...</p>
    </div>

    <!-- INDICATORE DI CARICAMENTO -->
    <div class="flex justify-center items-center py-4">
      <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-amber-500"></div>
    </div>

    <!-- PULSANTE LOGOUT (Disponibile se loggato) -->
    <div class="border-t border-slate-200 pt-4">
      <button onclick="eseguiLogout()" class="text-xs font-bold text-rose-600 hover:text-rose-800 transition cursor-pointer">
        <i class="fa-solid fa-right-from-bracket">⁠</i> Esci / Cambia Account
      </button>
    </div>

  </div>

<!-- SCRIPT DI CONTROLLO FIREBASE AUTH -->
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBNUrPHSTQovJRBMWVQDI-IH0M1YIGkv_U",
    authDomain: "qhseleo.firebaseapp.com",
    databaseURL: "https://vstvg-1f2f6-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "qhseleo",
    storageBucket: "qhseleo.firebasestorage.app",
    messagingSenderId: "401651146088",
    appId: "1:401651146088:web:eb341842059744d9974add",
    measurementId: "G-YK2XHZTDSP"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }

  // CONTROLLO DI ACCESSO
  firebase.auth().onAuthStateChanged((user) => {
    if (!user) {
      // Se l'utente NON è loggato, reindirizza alla pagina di login
      window.location.href = "login.html";
    } else {
      // Se è loggato, reindirizza all'hub principale
      setTimeout(() => {
        window.location.href = "HomeQHSE.html";
      }, 800);
    }
  });

  function eseguiLogout() {
    firebase.auth().signOut().then(() => {
      window.location.href = "login.html";
    });
  }
</script>

</body>
</html>
